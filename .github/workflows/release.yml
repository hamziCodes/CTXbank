name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      matrix:
        target:
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: .exe
            archive: zip
          - os: windows
            arch: arm64
            runner: windows-latest
            ext: .exe
            archive: zip
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ""
            archive: tar.gz
          - os: darwin
            arch: amd64
            runner: macos-latest
            ext: ""
            archive: tar.gz
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ""
            archive: tar.gz
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            ext: ""
            archive: tar.gz
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Binaries
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/ctx${{ matrix.target.ext }} ./cmd/ctx
          go build -ldflags="-s -w" -o dist/ctx-mcp${{ matrix.target.ext }} ./cmd/ctx-mcp
          cp README.md LICENSE dist/

      - name: Create Zip Archive (Windows)
        if: matrix.target.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "ctx-${{ matrix.target.os }}-${{ matrix.target.arch }}.zip"

      - name: Create Tarball Archive (Unix)
        if: matrix.target.archive == 'tar.gz'
        run: |
          tar -czvf "ctx-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz" -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctx-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: ctx-${{ matrix.target.os }}-${{ matrix.target.arch }}.${{ matrix.target.archive }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
